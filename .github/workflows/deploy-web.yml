name: Deploy web

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Trigger Amplify deployment
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WEB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start Amplify deployment
        id: start
        run: |
          JOB_ID="$(aws amplify start-job \
            --app-id "${{ vars.AMPLIFY_WEB_APP_ID }}" \
            --branch-name "${{ vars.AMPLIFY_WEB_BRANCH }}" \
            --job-type RELEASE \
            --job-reason "Manual GitHub Actions deploy from $GITHUB_SHA" \
            --query 'jobSummary.jobId' \
            --output text)"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Started Amplify job $JOB_ID"

      - name: Wait for Amplify deployment
        run: |
          JOB_ID="${{ steps.start.outputs.job_id }}"

          while true; do
            STATUS="$(aws amplify get-job \
              --app-id "${{ vars.AMPLIFY_WEB_APP_ID }}" \
              --branch-name "${{ vars.AMPLIFY_WEB_BRANCH }}" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)"
            echo "Amplify job $JOB_ID status: $STATUS"

            case "$STATUS" in
              SUCCEED)
                exit 0
                ;;
              FAILED|CANCELLED)
                exit 1
                ;;
            esac

            sleep 20
          done
