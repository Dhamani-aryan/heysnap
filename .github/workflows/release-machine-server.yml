name: Release machine server

on:
  workflow_dispatch:
    inputs:
      version:
        description: Machine server version to build and publish, for example 0.1.1
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      notes:
        description: Short release notes
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build and publish machine server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck machine server
        run: pnpm --filter @ank1015-app/server typecheck

      - name: Test machine server
        run: pnpm --filter @ank1015-app/server test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MACHINE_SERVER_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          IMAGE_URI: ${{ vars.MACHINE_SERVER_IMAGE_URI }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${IMAGE_URI%/*}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f packages/server/Dockerfile \
            -t "$IMAGE_URI:$VERSION" \
            -t "$IMAGE_URI:$CHANNEL" \
            --push \
            .

      - name: Publish cloud release manifest
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUD_SERVER_ADMIN_TOKEN }}
          IMAGE_URI: ${{ vars.MACHINE_SERVER_IMAGE_URI }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
        run: |
          node <<'NODE'
          void main().catch((error) => {
            console.error(error);
            process.exit(1);
          });

          async function main() {
            const adminToken = requireEnv("ADMIN_TOKEN");
            const imageUri = requireEnv("IMAGE_URI");
            const version = requireEnv("VERSION");
            const channel = requireEnv("CHANNEL");
            const notes = process.env.NOTES?.trim() || null;
            const dockerImage = `${imageUri}:${version}`;
            const response = await fetch("https://api.heysnap.xyz/admin/releases/machine-server", {
              method: "POST",
              body: JSON.stringify({
                channel,
                version,
                dockerImage,
                notes,
                metadata: {
                  imageUri,
                  imageTag: version,
                },
              }),
              headers: {
                authorization: `Bearer ${adminToken}`,
                "content-type": "application/json",
              },
            });
            const text = await response.text();

            if (!response.ok) {
              throw new Error(`Failed to publish machine server release: ${response.status} ${text}`);
            }

            console.log(`Published machine server ${version}: ${text}`);
          }

          function requireEnv(name) {
            const value = process.env[name];

            if (value === undefined || value.trim().length === 0) {
              throw new Error(`${name} is required`);
            }

            return value;
          }
          NODE

      - name: Configure AWS credentials for cloud server host
        if: ${{ inputs.channel == 'stable' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLOUD_SERVER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update cloud server machine defaults
        if: ${{ inputs.channel == 'stable' }}
        id: update-defaults
        env:
          IMAGE_URI: ${{ vars.MACHINE_SERVER_IMAGE_URI }}
          VERSION: ${{ inputs.version }}
        run: |
          COMMANDS="$(node <<'NODE'
          const imageUri = requireEnv("IMAGE_URI");
          const version = requireEnv("VERSION");
          const machineImage = `${imageUri}:${version}`;

          console.log(JSON.stringify({
            commands: [
              "set -euo pipefail",
              "CURRENT_CLOUD_IMAGE=\"$(docker inspect ank1015-cloud-server --format '{{.Config.Image}}')\"",
              "sudo cp /opt/ank1015/cloud-server.env /opt/ank1015/cloud-server.env.bak",
              upsertEnvCommand("MACHINE_SERVER_IMAGE", machineImage),
              upsertEnvCommand("MACHINE_SERVER_VERSION", version),
              "docker rm -f ank1015-cloud-server",
              "docker run -d --name ank1015-cloud-server --restart unless-stopped --network host --env-file /opt/ank1015/cloud-server.env \"$CURRENT_CLOUD_IMAGE\"",
              "sleep 2",
              "docker exec ank1015-cloud-server /bin/sh -lc 'printf \"MACHINE_SERVER_IMAGE=%s\\n\" \"$MACHINE_SERVER_IMAGE\"; printf \"MACHINE_SERVER_VERSION=%s\\n\" \"$MACHINE_SERVER_VERSION\"'",
              "docker logs --tail 50 ank1015-cloud-server",
            ],
          }));

          function upsertEnvCommand(key, value) {
            return [
              `if sudo grep -q '^${key}=' /opt/ank1015/cloud-server.env; then`,
              `  sudo sed -i "s|^${key}=.*|${key}=${value}|" /opt/ank1015/cloud-server.env;`,
              "else",
              `  printf '%s\\n' '${key}=${value}' | sudo tee -a /opt/ank1015/cloud-server.env >/dev/null;`,
              "fi",
            ].join(" ");
          }

          function requireEnv(name) {
            const value = process.env[name];

            if (value === undefined || value.trim().length === 0) {
              throw new Error(`${name} is required`);
            }

            return value;
          }
          NODE
          )"

          COMMAND_ID="$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "${{ vars.CLOUD_SERVER_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Update machine server defaults to $VERSION" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Started SSM command $COMMAND_ID"

      - name: Wait for cloud server defaults update
        if: ${{ inputs.channel == 'stable' }}
        run: |
          COMMAND_ID="${{ steps.update-defaults.outputs.command_id }}"

          while true; do
            STATUS="$(aws ssm get-command-invocation \
              --region "${{ vars.AWS_REGION }}" \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.CLOUD_SERVER_INSTANCE_ID }}" \
              --query 'Status' \
              --output text)"
            echo "SSM command $COMMAND_ID status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "${{ vars.AWS_REGION }}" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.CLOUD_SERVER_INSTANCE_ID }}" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "${{ vars.AWS_REGION }}" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.CLOUD_SERVER_INSTANCE_ID }}" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done
